[package]
name = "nexus"
version = "0.1.0"
description = "Project Nexus — a local-first, agentic desktop LLM application"
authors = ["Project Nexus contributors"]
edition = "2021"
rust-version = "1.77"

# The library powers both the desktop binary and (eventually) integration tests.
[lib]
name = "nexus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Async runtime + HTTP (runtime download, engine proxy, cloud providers)
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"

# Runtime management: download verification, archive extraction, randomness
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
rand = "0.8"

# Hardware detection (RAM, CPU); GPU is probed via the OS at runtime
sysinfo = "0.32"

# Embedded persistence — conversations, settings, library, connectors + FTS5.
# `bundled` compiles SQLite in (FTS5 enabled), so there is no system dependency.
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Multimodal input (Phase 5): text extraction from text-based PDFs (CHT-8) and
# base64 for inlining images into vision requests (CHT-5).
pdf-extract = "0.7"
base64 = "0.22"

# Secrets in the OS credential store (Windows Credential Manager) — MCP connector
# tokens (Phase 6) and cloud provider keys (Phase 7). Never persisted to SQLite.
keyring = "2"

# Win32 Job Objects: bind the engine child to a kill-on-close job so an ungraceful
# parent death (crash) can't leave an orphaned llama-server holding VRAM (§7.4).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  "Win32_Security",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
