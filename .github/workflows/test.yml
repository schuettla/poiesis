name: test

# Manual only (CROSS_PLATFORM_PLAN XP-5): the Rust unit tests on Linux, to find
# the ones that still assume Windows paths. Releases don't depend on it.
on:
  workflow_dispatch:

jobs:
  rust-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libssl-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # The frontend isn't built here; tauri's build script only needs the
      # folder `frontendDist` points at to exist.
      - name: stand-in frontend build
        run: mkdir -p dist

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --lib --no-fail-fast 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: failed tests
        if: failure()
        working-directory: src-tauri
        run: grep -E "^(test .* FAILED|---- )" test.log || true
