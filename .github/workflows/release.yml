name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:      # lets you run it by hand from the Actions tab

jobs:
  build:
    permissions:
      contents: write     # required: the job creates a Release
    outputs:
      release_id: ${{ steps.tauri.outputs.releaseId }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            args: ''
          # Apple Silicon only, and Linux as AppImage + deb: plans/CROSS_PLATFORM_PLAN.md D-2, D-3.
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          # ubuntu-24.04: xcap's pipewire 0.10 bindings don't compile against 22.04's
          # PipeWire 0.3.48. The AppImage's glibc floor is the build host's (2.39).
          - platform: 'ubuntu-24.04'
            args: '--bundles appimage,deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      # Fail in seconds, not after a twenty-minute build, if the tag and the
      # version files disagree. Skipped for a manual run, which has no tag.
      - name: tag matches the version files
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs "${{ github.ref_name }}"
        shell: bash

      - name: install Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev \
            libssl-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev \
            libegl-dev libgbm-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: npm ci

      # Self-signed code-signing certificate (CROSS_PLATFORM_PLAN D-1). It goes in
      # through our own keychain, not APPLE_CERTIFICATE: the bundler only accepts
      # Apple-issued certificate names there.
      - name: import self-signed signing certificate
        if: matrix.platform == 'macos-latest'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          # Pasted from a Windows text file, a secret can end in \r or \n.
          MAC_CERT_PASSWORD="$(printf '%s' "$MAC_CERT_PASSWORD" | tr -d '\r\n')"
          printf '%s' "$MAC_CERT_P12" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # Lengths and the file's hash only, to tell an old or mangled secret
          # from a wrong one. Expected: 3356, 30, sha256 49f407a0…acf60.
          echo "MAC_CERT_P12: ${#MAC_CERT_P12} chars, MAC_CERT_PASSWORD: ${#MAC_CERT_PASSWORD} chars"
          echo "cert.p12 sha256: $(shasum -a 256 "$RUNNER_TEMP/cert.p12" | cut -c1-64)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -t 3600 -u "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign -k "$KC"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      # The updater key and its password, with any pasted line ending removed
      # (a trailing \r or \n turns the right password into "Wrong password for
      # that key"). Only lengths are printed.
      - name: clean updater signing secrets
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          KEY_PW: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          key="$(printf '%s' "$KEY" | tr -d ' \r\n')"
          pw="$(printf '%s' "$KEY_PW" | tr -d '\r\n')"
          echo "updater key: ${#KEY} chars as stored, ${#key} cleaned; password: ${#KEY_PW} as stored, ${#pw} cleaned"
          echo "TAURI_SIGNING_PRIVATE_KEY=$key" >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$pw" >> "$GITHUB_ENV"

      # The portable Windows exe: built and copied before tauri-action bundles,
      # so it carries no installer mark and updates itself by swapping its file
      # (commands/updater.rs). Signed with the same key as the installers.
      - name: build and sign the portable exe
        id: portable
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          npx tauri build --no-bundle
          ver="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          name="Poiesis-Agent_${ver}_x64_portable.exe"
          mkdir -p "$RUNNER_TEMP/portable"
          cp src-tauri/target/release/poiesis.exe "$RUNNER_TEMP/portable/$name"
          npx tauri signer sign "$RUNNER_TEMP/portable/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty on Windows/Linux, where it is ignored. No APPLE_ID / notarisation (D-1).
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && 'Poiesis Self-Signed' || '' }}
        with:
          tagName: v__VERSION__
          releaseName: 'Poiesis Agent v__VERSION__'
          releaseBody: 'See the assets below to download and install this version. Windows without installing: download the _portable.exe file and run it.'
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: upload the portable exe
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          name="${{ steps.portable.outputs.name }}"
          curl -fsS -X POST -H "Authorization: Bearer $GITHUB_TOKEN"             -H "Content-Type: application/octet-stream"             --data-binary @"$RUNNER_TEMP/portable/$name"             "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ steps.tauri.outputs.releaseId }}/assets?name=$name" > /dev/null

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'windows-latest'
        with:
          name: portable-sig
          path: ${{ runner.temp }}/portable/*.sig

  # Adds the portable exe to the update list (latest.json), after every
  # platform's tauri-action has written its part of it.
  portable-update-entry:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: portable-sig
          path: sig

      - name: add the portable exe to latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ID: ${{ needs.build.outputs.release_id }}
        run: |
          api() { curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "$@"; }
          sigfile="$(ls sig/*.sig)"
          name="$(basename "$sigfile" .sig)"
          tag="$(api "https://api.github.com/repos/$REPO/releases/$ID" | jq -r .tag_name)"
          asset="$(api "https://api.github.com/repos/$REPO/releases/$ID/assets" | jq -r '.[] | select(.name=="latest.json") | .id')"
          api -H "Accept: application/octet-stream" "https://api.github.com/repos/$REPO/releases/assets/$asset" > latest.json
          jq --arg sig "$(cat "$sigfile")"              --arg url "https://github.com/$REPO/releases/download/$tag/$name"              '.platforms["windows-x86_64-portable"] = {signature: $sig, url: $url}' latest.json > new.json
          api -X DELETE "https://api.github.com/repos/$REPO/releases/assets/$asset"
          api -X POST -H "Content-Type: application/json" --data-binary @new.json             "https://uploads.github.com/repos/$REPO/releases/$ID/assets?name=latest.json" > /dev/null
          jq '.platforms | keys' new.json
