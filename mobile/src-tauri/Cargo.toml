[package]
name = "poiesis-companion"
version = "0.1.0"
description = "Poiesis on your phone: a remote control for the Poiesis that runs on your computer."
edition = "2021"
rust-version = "1.91"

# Not part of the desktop crate: the desktop crate pulls desktop-only crates (screen capture, keyring,
# mail, speech) and is never built for a phone. This crate holds only the link to the desktop.
[lib]
name = "poiesis_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The link. Same version as the desktop, default features keep `tls-ring` (no C build step on Android).
iroh = "1.5"
# The frame format and the pairing payload, shared with the desktop so they cannot drift apart.
remote-proto = { path = "../../remote-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "time", "sync"] }

# A debug build for the phone carries no Rust debug information: nobody steps through it on the phone, and with it
# the APK was over 600 MB, too big to install reliably over wireless adb.
[profile.dev]
debug = false
strip = "debuginfo"

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# Scans the QR code on the desktop.
tauri-plugin-barcode-scanner = "2"
