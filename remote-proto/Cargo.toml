[package]
name = "remote-proto"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "The wire format shared by the Poiesis desktop and the Poiesis phone app (REM-11)."

# Nothing here knows about iroh or Tauri: the frame functions work on any tokio stream, so the
# desktop and the phone cannot drift apart on the format.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
